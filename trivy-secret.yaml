# Secret scanning: third-party packages ship example keys in docstrings and tests.
# Our own code and config are still scanned; vulnerability scanning is unaffected.
allow-rules:
  - id: third-party-python-packages
    description: Installed Python packages (example tokens in SDK docs)
    path: '^/?app/\.venv/lib/python3\.12/site-packages/.*'
  - id: third-party-node-modules
    description: Installed Node packages
    path: '.*/node_modules/.*'
