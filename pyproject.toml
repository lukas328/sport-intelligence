[project]
name = "handball-ai-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "mypy>=1.15",
  "ruff>=0.9",
  "import-linter>=2.1",
  "fakeredis>=2.26",
  "pre-commit>=4.0",
  "asyncpg>=0.32.0",
  "onnx>=1.23.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/gpu-worker", "packages/court", "packages/vision", "packages/jobkit", "packages/metrics"]

[tool.uv.sources]
handball-court = { workspace = true }
handball-vision = { workspace = true }
handball-jobkit = { workspace = true }
handball-metrics = { workspace = true }
handball-api = { workspace = true }
handball-worker = { workspace = true }
handball-gpu-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "N"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["handball_api", "handball_worker", "handball_gpu_worker", "handball_court", "handball_vision", "handball_jobkit", "handball_metrics"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PTH"]
"packages/court/scripts/*.py" = ["E501"]
"**/mail_templates.py" = ["E501"]
"**/services/invoices.py" = ["E501"]  # mail texts in three languages
# ffmpeg/ffprobe are called with fixed argument lists, never through a shell
"apps/worker/src/handball_worker/media/*.py" = ["S603", "S404"]
"apps/worker/src/handball_worker/export.py" = ["S603", "S404"]
"apps/worker/src/handball_worker/reels.py" = ["S603", "S404"]
"packages/vision/handball_vision/*.py" = ["E501"]
# developer tools (seed data, evaluation): long literals, fixed subprocess argv, non-crypto RNG
"scripts/*.py" = ["E501", "S311", "S603"]
"ml/**/*.py" = ["E501", "S311", "S603"]
# local development defaults, overridden by environment in deployments
"apps/worker/src/handball_worker/config.py" = ["S105", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/court:packages/vision:packages/jobkit:packages/metrics:apps/api/src:apps/worker/src:apps/gpu-worker/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# OpenCV/numpy return loosely typed arrays; keep strict otherwise
module = ["handball_vision.*", "handball_gpu_worker.analysis"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["cv2.*", "av.*", "pyarrow.*", "onnxruntime.*", "onnx.*", "scipy.*", "rq.*", "fakeredis.*", "boto3.*", "botocore.*", "structlog.*", "asyncpg.*", "qrcode.*", "reportlab.*", "qrbill.*", "svglib.*", "stdnum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs running postgres/redis/minio (docker compose)"]
addopts = "-m 'not integration' --import-mode=importlib"

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["handball_api", "handball_worker", "handball_gpu_worker", "handball_court", "handball_vision", "handball_jobkit", "handball_metrics"]
omit = ["**/migrations/**", "**/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["handball_api", "handball_worker", "handball_gpu_worker", "handball_court", "handball_vision", "handball_jobkit", "handball_metrics"]

[[tool.importlinter.contracts]]
name = "Shared packages import no app"
type = "forbidden"
source_modules = ["handball_court", "handball_vision", "handball_jobkit", "handball_metrics"]
forbidden_modules = ["handball_api", "handball_worker", "handball_gpu_worker"]

[[tool.importlinter.contracts]]
name = "Apps are independent of each other"
type = "independence"
modules = ["handball_api", "handball_worker", "handball_gpu_worker"]

[[tool.importlinter.contracts]]
name = "API layers (routers > services > schemas > models > core)"
type = "layers"
layers = [
  "handball_api.main",
  "handball_api.routers",
  "handball_api.services",
  "handball_api.integrations",
  "handball_api.schemas",
  "handball_api.models",
  "handball_api.core",
]
