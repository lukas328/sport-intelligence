# Deploys the Azure environment (infra/terraform/azure) from GitHub Actions with OIDC: no password is
# stored anywhere. Set up once with infra/azure/setup-github-deploy.sh in Azure Cloud Shell.
#
#   - Actions → Deploy → Run workflow: «plan» shows what would change, «deploy» rolls out this commit.
#   - A push to the working branch whose commit message contains [deploy] or [deploy-plan] does the same.
#   - stack «eu» (docs/plans/staging-umzug-eu.md): the second environment in Sweden Central, own state
#     (staging-eu.tfstate) and settings (staging-eu.tfvars, derived from staging.tfvars the first
#     time). «bootstrap» builds it: vault and registry first, the secrets copied from the first
#     environment's vault (never printed), then images, migrations and apps as a deploy.
#     «move-db» copies the database from the first environment (infra/azure/move-db.sh: the old web
#     app goes into maintenance, pg_dump/pg_restore, row counts compared).
#   - «teardown» (stack ch, input confirm = the resource group name) deletes the first environment
#     for good (infra/azure/teardown-ch.sh, docs/plans/staging-umzug-eu.md section 7). Only with the
#     owner's OK.
#   - A paused environment (README, «Pause») stays paused: only «resume» ([resume] in the commit
#     message) starts the database and scales the apps up again; «pause» ([pause]) does the reverse.
#
# Order of a deploy: images are built in the registry, the migration job gets the new image and runs,
# then the apps get the new image, the custom domain is bound, and the health checks must pass.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan, deploy, or status (read only: apps, jobs, recent logs)"
        type: choice
        options: [plan, deploy, status, bootstrap, move-db, teardown]
        default: plan
      gpu:
        description: "stack eu: switch the serverless GPU job on (once Azure granted the T4 quota) or off; keep leaves the setting as it is"
        type: choice
        options: [keep, "on", "off"]
        default: keep
      stack:
        description: "ch: the environment in Switzerland North; eu: the one in Sweden Central with the serverless GPU (bootstrap builds it the first time)"
        type: choice
        options: [ch, eu]
        default: ch
      state:
        description: keep the environment as it is, resume a paused one, or pause it
        type: choice
        options: [keep, resume, pause]
        default: keep
      confirm:
        description: "with teardown: the name of the resource group that is deleted (rg-hb-stg)"
        type: string
        default: ""
      diag:
        description: "with status: read the newest finished analysis (log, result, artefacts) into a run artefact"
        type: boolean
        default: false
      oneoff:
        description: "with diag: also run the data fixes in infra/azure/oneoff/*.sql (one transaction each)"
        type: boolean
        default: false
      diag_asset:
        description: "with diag: this video asset id instead of the newest"
        type: string
        default: ""
  push:
    branches: [claude/compassionate-pascal-n3gl03]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # identifiers from infra/azure/setup-github-deploy.sh (none of them is a secret)
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '0a334e89-9561-447e-98be-9d431fdb3d85' }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || '23ee75d0-37f8-49fc-8971-abf225b907a3' }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || 'aac801cd-121f-4174-b5b5-29801d81d0a7' }}
  ARM_USE_OIDC: "true"
  TFSTATE_RG: rg-hb-tfstate
  TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT || 'sthbtfstate72432' }}
  TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'staging.tfstate' }}
  APP_DOMAIN: app.handball-intelligence.com
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy')
    name: Deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 180
    defaults:
      run:
        # explicit bash runs with -o pipefail: a failing terraform in `| tee` fails the step
        shell: bash
        working-directory: infra/terraform/azure
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then mode="${{ inputs.mode }}";
          elif ${{ contains(github.event.head_commit.message, '[deploy-plan]') }}; then mode=plan;
          else mode=deploy; fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then state="${{ inputs.state }}";
          elif ${{ contains(github.event.head_commit.message, '[resume]') }}; then state=resume;
          elif ${{ contains(github.event.head_commit.message, '[pause]') }}; then state=pause;
          else state=keep; fi
          stack="${{ inputs.stack || 'ch' }}"
          case "$mode" in bootstrap|move-db) [ "$stack" = eu ] || { echo "::error::$mode is for the stack eu"; exit 1; } ;; esac
          [ "$mode" != teardown ] || [ "$stack" = ch ] || { echo "::error::teardown is for the stack ch only"; exit 1; }
          if [ "$stack" = eu ]; then
            echo "TFSTATE_KEY=staging-eu.tfstate" >>"$GITHUB_ENV"
            echo "TFVARS=staging-eu.tfvars" >>"$GITHUB_ENV"
          else
            echo "TFVARS=staging.tfvars" >>"$GITHUB_ENV"
          fi
          apply=false
          if [ "$mode" = deploy ] || [ "$mode" = bootstrap ]; then apply=true; fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "apply=$apply" >>"$GITHUB_OUTPUT"
          # the steps of plan and deploy: not for the read-only and one-off modes
          case "$mode" in plan|deploy|bootstrap) infra=true ;; *) infra=false ;; esac
          echo "infra=$infra" >>"$GITHUB_OUTPUT"
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          echo "state=$state" >>"$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=7 HEAD)" >>"$GITHUB_OUTPUT"
          echo "Mode: $mode, stack: $stack, environment: $state, commit $(git rev-parse --short=7 HEAD)"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          # 1.9 evaluates plantimestamp() as year 1 while validating and rejects the budget
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Settings and state
        run: |
          if ! az storage blob download --account-name "$TFSTATE_ACCOUNT" -c tfstate -n "$TFVARS" \
              -f "$TFVARS" --auth-mode login -o none; then
            [ "$TFVARS" = staging-eu.tfvars ] || exit 1
            # the first run of the eu stack: the settings of the first environment, with its own
            # name (the resource group must be new), region, GPU and mail data location
            az storage blob download --account-name "$TFSTATE_ACCOUNT" -c tfstate -n staging.tfvars \
              -f base.tfvars --auth-mode login -o none
            python3 - <<'PY'
          import re
          text = open("base.tfvars").read()
          # gpu stays off until Azure grants the T4 quota (a T4 profile without quota can fail the
          # environment); the CPU app analyses as today, `gpu = true` in staging-eu.tfvars switches
          eu = {"name": '"hbeu"', "location": '"swedencentral"', "gpu": "false",
                "mail_data_location": '"Europe"', "kv_runner_role": "true",
                "bind_custom_domain": "false", "paused": "false"}
          for key in eu:
              text = re.sub(rf"^{key}\s*=.*\n", "", text, flags=re.M)
          text = text.rstrip("\n") + "\n" + "".join(f"{k} = {v}\n" for k, v in eu.items())
          open("staging-eu.tfvars", "w").write(text)
          print("staging-eu.tfvars derived from staging.tfvars:", ", ".join(f"{k}={v}" for k, v in eu.items()))
          PY
            rm -f base.tfvars
          fi
          case "${{ inputs.gpu || 'keep' }}" in
            on)  sed -i '/^gpu *=/d' "$TFVARS"; echo 'gpu = true' >>"$TFVARS"; echo "gpu switched on" ;;
            off) sed -i '/^gpu *=/d' "$TFVARS"; echo 'gpu = false' >>"$TFVARS"; echo "gpu switched off" ;;
          esac
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          echo "rg=$(terraform output -raw resource_group 2>/dev/null || true)" >>"$GITHUB_ENV"
          echo "registry=$(terraform output -raw registry_name 2>/dev/null || true)" >>"$GITHUB_ENV"

      - name: Bootstrap (stack eu, first time)
        if: steps.mode.outputs.mode == 'bootstrap'
        run: |
          vars=(-input=false -no-color -var-file="$TFVARS" -var "image_tag=${{ steps.mode.outputs.tag }}"
                -var "app_domain=$APP_DOMAIN" -var "bind_custom_domain=false" -var "paused=false" -var "mail_live=false")
          # vault, its secrets and the registry first (the runner's role on the new vault can take
          # a minute to work: retried)
          for i in 1 2 3; do
            terraform apply -auto-approve "${vars[@]}" -target=azurerm_key_vault_secret.carried \
              -target=azurerm_key_vault_secret.manual -target=azurerm_role_assignment.acr_pull \
              -target=azurerm_container_registry.this && break
            [ "$i" = 3 ] && exit 1
            sleep 60
          done
          rg=$(terraform output -raw resource_group)
          kv=$(terraform output -raw key_vault)
          old_kv=$(az keyvault list -g rg-hb-stg --query "[0].name" -o tsv)
          # every secret of the first environment except those this environment generates itself
          # (database passwords and URLs, internal token, mail key); values are never printed
          own=" hb-internal-token hb-database-url hb-migration-db-url hb-admin-dsn hb-app-db-password hb-acs-connection-string "
          for n in $(az keyvault secret list --vault-name "$old_kv" --query "[].name" -o tsv); do
            case "$own" in *" $n "*) continue ;; esac
            v=$(az keyvault secret show --vault-name "$old_kv" -n "$n" --query value -o tsv)
            while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<<"$v"
            printf '%s' "$v" >"$RUNNER_TEMP/secret"
            az keyvault secret set --vault-name "$kv" -n "$n" --file "$RUNNER_TEMP/secret" --encoding utf-8 -o none
            rm -f "$RUNNER_TEMP/secret"
            echo "copied $n from $old_kv to $kv"
          done
          echo "rg=$rg" >>"$GITHUB_ENV"
          echo "registry=$(terraform output -raw registry_name)" >>"$GITHUB_ENV"

      - name: Status (read only)
        if: steps.mode.outputs.mode == 'status'
        run: |
          echo "== apps"
          az containerapp list -g "$rg" --query "[].{name:name, running:properties.runningStatus, revision:properties.latestRevisionName, image:properties.template.containers[0].image, min:properties.template.scale.minReplicas, max:properties.template.scale.maxReplicas, cpu:properties.template.containers[0].resources.cpu, mem:properties.template.containers[0].resources.memory}" -o table
          for app in $(az containerapp list -g "$rg" --query "[].name" -o tsv); do
            echo "== replicas $app"
            az containerapp replica list -g "$rg" -n "$app" --query "[].{name:name, created:properties.createdTime, state:properties.runningState, restarts:properties.containers[0].restartCount}" -o table || true
          done
          for app in $(az containerapp list -g "$rg" --query "[?contains(name,'worker') || contains(name,'api')].name" -o tsv); do
            echo "== last 150 log lines $app"
            az containerapp logs show -g "$rg" -n "$app" --type console --tail 150 --format text 2>&1 | cut -c1-400 || true
            echo "== system events $app"
            az containerapp logs show -g "$rg" -n "$app" --type system --tail 40 --format text 2>&1 | cut -c1-300 || true
          done
          ws=$(az monitor log-analytics workspace list -g "$rg" --query "[0].customerId" -o tsv)
          if [ -n "$ws" ]; then
            echo "== errors in the last 8 hours (Log Analytics)"
            az monitor log-analytics query -w "$ws" -o table --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(8h) | where Log_s has_any ('error','Error','ERROR','Traceback','exception','Killed','OOM','failed') | project TimeGenerated, ContainerAppName_s, Log=substring(Log_s, 0, 300) | order by TimeGenerated desc | take 80" 2>&1 | cut -c1-420 || true
            # The API logs every unexpected 500 as one JSON line (event unhandled_exception) whose
            # exception field holds the whole traceback. Print it in full: the queries above cut
            # lines, which loses the frame that raised.
            echo "== last 20 unhandled exceptions of the API, full traceback (Log Analytics, 48 hours)"
            az monitor log-analytics query -w "$ws" -o json --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(48h) | where ContainerAppName_s contains 'api' | where Log_s has 'unhandled_exception' | extend j = parse_json(Log_s) | project TimeGenerated, method=tostring(j.method), path=tostring(j.path), request_id=tostring(j.request_id), exception=iff(isempty(tostring(j.exception)), Log_s, tostring(j.exception)) | order by TimeGenerated desc | take 20" >"$RUNNER_TEMP/unhandled.json" 2>&1 || true
            jq -r '.[] | "--- \(.TimeGenerated) \(.method) \(.path) request_id=\(.request_id)\n\(.exception)\n"' "$RUNNER_TEMP/unhandled.json" 2>/dev/null || cat "$RUNNER_TEMP/unhandled.json"
            echo "== restarts and OOM (system log)"
            az monitor log-analytics query -w "$ws" -o table --analytics-query "ContainerAppSystemLogs_CL | where TimeGenerated > ago(8h) | where Reason_s has_any ('OOM','Kill','BackOff','Failed','Crash','Terminated') or Log_s has_any ('OOM','killed','Killed','exit code') | project TimeGenerated, ContainerAppName_s, Reason_s, Log=substring(Log_s, 0, 250) | order by TimeGenerated desc | take 40" 2>&1 | cut -c1-400 || true
          fi
          echo "== migration job runs"
          az containerapp job execution list -g "$rg" -n "$(terraform output -raw migrate_job)" --query "[0:3].{name:name, status:properties.status, start:properties.startTime}" -o table || true

      - name: Analysis diagnosis (read only)
        if: steps.mode.outputs.mode == 'status' && inputs.diag
        env:
          OUT: ${{ runner.temp }}/diag
          DIAG_ASSET: ${{ inputs.diag_asset }}
          ONEOFF: ${{ inputs.oneoff }}
          FW_RULE: gh-diag-${{ github.run_id }}
        run: bash ../../azure/staging-diag.sh

      - name: Remove the diagnosis firewall rule
        if: always() && steps.mode.outputs.mode == 'status' && inputs.diag
        run: |
          az postgres flexible-server firewall-rule delete -g "$rg" --server-name "$(terraform output -raw postgres_server)" \
            --name "gh-diag-${{ github.run_id }}" --yes -o none || true

      - name: Diagnosis artefact
        if: always() && steps.mode.outputs.mode == 'status' && inputs.diag
        uses: actions/upload-artifact@v4
        with:
          name: analysis-diag-${{ github.run_id }}
          path: ${{ runner.temp }}/diag
          retention-days: 5
          if-no-files-found: warn

      - name: Move the database (stack eu; the old web app goes into maintenance)
        if: steps.mode.outputs.mode == 'move-db'
        env:
          FW_RULE: gh-move-db-${{ github.run_id }}
        run: bash ../../azure/move-db.sh

      - name: Delete the first environment (stack ch, teardown)
        if: steps.mode.outputs.mode == 'teardown'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: bash ../../azure/teardown-ch.sh

      - name: Teardown artefact
        if: always() && steps.mode.outputs.mode == 'teardown'
        uses: actions/upload-artifact@v4
        with:
          name: teardown-${{ github.run_id }}
          path: ${{ runner.temp }}/teardown
          if-no-files-found: ignore

      - name: Paused or running
        if: steps.mode.outputs.infra == 'true'
        id: state
        run: |
          pg=$(terraform output -raw postgres_server 2>/dev/null || true)
          web=$(terraform output -raw web_app 2>/dev/null || true)
          # «keep» means what runs now in Azure, not what the settings file remembers
          api=""
          if [ -n "$web" ]; then
            api=$(az containerapp show -g "$rg" -n "${web%-web}-api" -o json 2>/dev/null || true)
          fi
          if [ -n "$pg" ] && az postgres flexible-server show -g "$rg" -n "$pg" -o none 2>/dev/null; then
            db=$(az postgres flexible-server show -g "$rg" -n "$pg" --query state -o tsv)
          else
            db=Ready  # no server yet: a new environment (bootstrap)
          fi
          if [ -z "$api" ]; then
            # no apps yet (a new or half-built environment): nothing runs, nothing to keep
            api='{"properties":{"template":{"containers":[{"env":[]}]}}}'
            paused=false
          else
            # paused: the cron rule «paused» on the api (README, «Pause»), or the database stopped
            paused=$(jq -r '[.properties.template.scale.rules // [] | .[] | select(.name == "paused")] | length > 0' <<<"$api")
          fi
          [ "$db" = Ready ] || paused=true
          # move-db turns the old web app's ingress off (maintenance) with az; Terraform cannot read
          # its custom domain without ingress (plan fails), and it defines the ingress anyway: on
          # again before the plan (a paused environment then goes to 0 replicas in this run)
          if [ -n "$web" ] && az containerapp show -g "$rg" -n "$web" -o none 2>/dev/null; then
            ing=$(az containerapp show -g "$rg" -n "$web" --query "properties.configuration.ingress" -o tsv 2>/dev/null || true)
            if [ -z "$ing" ]; then
              echo "ingress of $web is off (maintenance): turning it on for Terraform"
              az containerapp ingress enable -g "$rg" -n "$web" --type external --target-port 3000 -o none
            fi
          fi
          want="${{ steps.mode.outputs.state }}"
          case "$want" in resume) paused=false ;; pause) paused=true ;; esac
          echo "database $pg: $db; paused after this run: $paused"
          if [ "$want" = resume ] && [ "$db" != Ready ] && [ "${{ steps.mode.outputs.apply }}" = true ]; then
            az postgres flexible-server start -g "$rg" -n "$pg" -o none
            db=$(az postgres flexible-server show -g "$rg" -n "$pg" --query state -o tsv)
            echo "database started: $db"
          fi
          if [ "$db" != Ready ] && [ "${{ steps.mode.outputs.apply }}" = true ]; then
            echo "::error::The environment is paused (database $db). Deploy with state «resume» ([resume] in the commit message) to start it."
            exit 1
          fi
          # a stopped server cannot be read: plan without refreshing then (README, «Pause»)
          refresh=$([ "$db" = Ready ] && echo true || echo false)
          # settings changed by hand in Azure that the settings file does not know yet (the mail
          # backend «console» while no mail provider is set up): keep them through extra_env
          python3 - "$api" <<'PY'
          import json, os, re, sys
          live = {e["name"]: e.get("value") for e in json.loads(sys.argv[1])["properties"]["template"]["containers"][0]["env"]}
          text = open(os.environ["TFVARS"]).read()
          m = re.search(r"^extra_env\s*=\s*(\{.*\})\s*$", text, re.M)
          extra = json.loads(m.group(1)) if m else {}
          for key, default in {"HB_EMAIL_BACKEND": "smtp", "HB_PWNED_CHECK": "true"}.items():
              if live.get(key) not in (None, default) and key not in extra:
                  extra[key] = live[key]
                  print(f"keep {key}={live[key]} from the running app")
          # non-secret settings kept in the repository (infra/azure/staging-env.json) win over the
          # stored file; null removes a key. The model keys of the analysis live here.
          try:
              wanted = json.load(open("../../azure/staging-env.json"))
          except FileNotFoundError:
              wanted = {}
          for key, value in wanted.items():
              if value is None:
                  extra.pop(key, None)
              else:
                  extra[key] = value
              print(f"setting {key}={value!r} from staging-env.json")
          line = "extra_env        = " + json.dumps(extra)
          text = re.sub(r"^extra_env\s*=.*$", line, text, flags=re.M) if m else text + line + "\n"
          open(os.environ["TFVARS"], "w").write(text)
          PY
          echo "PAUSED=$paused" >>"$GITHUB_ENV"
          echo "REFRESH=$refresh" >>"$GITHUB_ENV"
          echo "PG=$pg" >>"$GITHUB_ENV"

      - name: DNS records for the app domain
        if: steps.mode.outputs.infra == 'true'
        id: dns
        run: |
          fqdn=$(terraform output -raw web_default_fqdn 2>/dev/null || true)
          asuid=$(terraform output -raw custom_domain_verification_id 2>/dev/null || true)
          echo "CNAME ${APP_DOMAIN%%.*} -> $fqdn (DNS only)"
          echo "TXT asuid.${APP_DOMAIN%%.*} -> $asuid"
          ok=false
          if [ -n "$fqdn" ] && [ "$(dig +short CNAME "$APP_DOMAIN" | sed 's/\.$//')" = "$fqdn" ] && \
             dig +short TXT "asuid.$APP_DOMAIN" | grep -q "$asuid"; then ok=true; fi
          echo "ready=$ok" >>"$GITHUB_OUTPUT"
          echo "DNS ready: $ok"

      - name: Mail domain (Azure Communication Services)
        if: steps.mode.outputs.infra == 'true'
        run: |
          # the sending domain exists after the first apply with the mail service; its DNS records
          # are set by hand (terraform output mail_verification_records). Here Azure is asked to
          # verify what is not verified yet; once all four are, mail_live links the domain and
          # switches the apps to it.
          live=false
          id=$(terraform output -raw mail_domain_id 2>/dev/null || true)
          case "$id" in /subscriptions/*) ;; *) id="" ;; esac
          if [ -z "$id" ]; then
            echo "no sending domain yet (created by this apply)"
          else
            url="https://management.azure.com${id}?api-version=2023-03-31"
            states() { az rest --method get --url "$url" --query "properties.verificationStates" -o json; }
            az rest --method get --url "$url" --query "properties.verificationRecords" -o json || true
            for t in Domain SPF DKIM DKIM2; do
              s=$(states | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('$t',{}).get('status',''))")
              echo "$t: $s"
              if [ "$s" != Verified ] && [ "$s" != VerificationRequested ] && [ "$s" != VerificationInProgress ]; then
                az rest --method post --url "https://management.azure.com${id}/initiateVerification?api-version=2023-03-31" \
                  --body "{\"verificationType\": \"$t\"}" -o none || echo "$t: verification not started (DNS record missing?)"
              fi
            done
            for i in $(seq 1 20); do
              n=$(states | python3 -c "import json,sys;d=json.load(sys.stdin) or {};print(sum(d.get(t,{}).get('status')=='Verified' for t in ('Domain','SPF','DKIM','DKIM2')))")
              echo "$(date -u +%T) verified $n of 4"
              [ "$n" = 4 ] && live=true && break
              sleep 30
            done
          fi
          echo "MAIL_LIVE=$live" >>"$GITHUB_ENV"
          echo "mail live: $live"

      - name: Plan
        if: steps.mode.outputs.infra == 'true'
        run: |
          tag=$([ "${{ steps.mode.outputs.apply }}" = true ] && echo "${{ steps.mode.outputs.tag }}" || sed -n 's/^image_tag *= *"\(.*\)"/\1/p' "$TFVARS")
          echo "TAG=$tag" >>"$GITHUB_ENV"
          echo "BIND=${{ steps.dns.outputs.ready }}" >>"$GITHUB_ENV"
          terraform plan -input=false -no-color -var-file="$TFVARS" \
            -var "image_tag=$tag" -var "app_domain=$APP_DOMAIN" \
            -var "bind_custom_domain=${{ steps.dns.outputs.ready }}" -var "paused=$PAUSED" -var "mail_live=$MAIL_LIVE" \
            -refresh=$REFRESH -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan (staging, stack ${{ steps.mode.outputs.stack }})"
            echo '```'
            grep -E '^(  # |Plan:|No changes)' plan.txt || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Images
        if: steps.mode.outputs.apply == 'true'
        working-directory: .
        run: |
          missing=0
          for app in api worker web gpu-worker; do
            az acr repository show-tags -n "$registry" --repository "hb-$app" -o tsv 2>/dev/null | grep -qx "$TAG" || missing=1
          done
          cuda=ok
          if grep -Eq '^gpu *= *true' "infra/terraform/azure/$TFVARS"; then
            az acr repository show-tags -n "$registry" --repository hb-gpu-worker-cuda -o tsv 2>/dev/null | grep -qx "$TAG" || cuda=missing
          fi
          if [ "$missing" = 0 ] && [ "$cuda" = ok ]; then echo "images $TAG exist"; exit 0; fi
          ctx=$(mktemp -d)
          git archive HEAD | tar -x -C "$ctx"
          # .dockerignore leaves out infra/: the task files go to the root of the upload
          cp infra/terraform/azure/acr-build.yaml infra/terraform/azure/acr-build-cuda.yaml "$ctx/"
          if [ "$missing" = 1 ]; then
            az acr run -r "$registry" -f acr-build.yaml --set "tag=$TAG" --timeout 7200 "$ctx"
          fi
          if [ "$cuda" = missing ]; then
            # the image of the serverless GPU job (apps/gpu-worker/Dockerfile.cuda)
            az acr run -r "$registry" -f acr-build-cuda.yaml --set "tag=$TAG" --timeout 7200 "$ctx"
          fi

      - name: Migrations
        if: steps.mode.outputs.apply == 'true'
        run: |
          terraform apply -input=false -auto-approve -no-color -var-file="$TFVARS" \
            -var "image_tag=$TAG" -var "app_domain=$APP_DOMAIN" -var "bind_custom_domain=$BIND" \
            -var "paused=$PAUSED" -var "mail_live=$MAIL_LIVE" -target=azurerm_container_app_job.migrate \
            -target=azurerm_key_vault_secret.carried -target=azurerm_key_vault_secret.generated
          # the two secrets that moved address (moved blocks) must be in a targeted apply until the
          # state has them at the new address; their values do not change (Terraform refuses otherwise)
          job=$(terraform output -raw migrate_job)
          run=$(az containerapp job start -n "$job" -g "$rg" --query name -o tsv)
          echo "migration run $run"
          for i in $(seq 1 90); do
            status=$(az containerapp job execution show -n "$job" -g "$rg" --job-execution-name "$run" --query properties.status -o tsv)
            echo "$(date -u +%T) $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                # the job's own output (Log Analytics takes a minute or two to have it)
                ws=$(az monitor log-analytics workspace list -g "$rg" --query "[0].customerId" -o tsv)
                sleep 90
                az monitor log-analytics query -w "$ws" -o tsv --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(1h) | where ContainerJobName_s == '$job' or ContainerGroupName_s startswith '$run' | order by TimeGenerated asc | project TimeGenerated, Log=substring(Log_s, 0, 400) | take 200" 2>&1 | cut -c1-450 || true
                az containerapp job execution show -n "$job" -g "$rg" --job-execution-name "$run" -o json | jq '.properties' || true
                exit 1 ;;
            esac
            sleep 20
          done
          echo "migration did not finish in 30 minutes"; exit 1

      - name: Apply
        if: steps.mode.outputs.apply == 'true'
        run: |
          terraform apply -input=false -auto-approve -no-color -var-file="$TFVARS" \
            -var "image_tag=$TAG" -var "app_domain=$APP_DOMAIN" -var "bind_custom_domain=$BIND" \
            -var "paused=$PAUSED" -var "mail_live=$MAIL_LIVE"

      - name: Managed certificate for the app domain
        if: steps.mode.outputs.apply == 'true' && env.BIND == 'true'
        run: |
          web=$(terraform output -raw web_app)
          binding=$(az containerapp hostname list -g "$rg" -n "$web" --query "[?name=='$APP_DOMAIN'].bindingType | [0]" -o tsv)
          if [ "$binding" = SniEnabled ]; then echo "certificate bound"; exit 0; fi
          az containerapp hostname bind -g "$rg" -n "$web" --hostname "$APP_DOMAIN" \
            --environment "$(terraform output -raw container_app_environment)" --validation-method CNAME -o none

      - name: Remember what is deployed
        if: steps.mode.outputs.apply == 'true'
        run: |
          sed -i -e "s/^image_tag *=.*/image_tag             = \"$TAG\"/" \
                 -e "s/^app_domain *=.*/app_domain            = \"$APP_DOMAIN\"/" \
                 -e "s/^bind_custom_domain *=.*/bind_custom_domain    = $BIND/" \
                 -e "s/^paused *=.*/paused            = $PAUSED/" "$TFVARS"
          az storage blob upload --account-name "$TFSTATE_ACCOUNT" -c tfstate -n "$TFVARS" \
            -f "$TFVARS" --auth-mode login --overwrite -o none

      - name: Stop the database (pause)
        if: steps.mode.outputs.apply == 'true' && env.PAUSED == 'true'
        run: |
          az postgres flexible-server stop -g "$rg" -n "$PG" -o none
          echo "Paused: apps at 0, database stopped (Azure starts it again by itself after 7 days)" >>"$GITHUB_STEP_SUMMARY"

      - name: Health checks
        if: steps.mode.outputs.apply == 'true' && env.PAUSED != 'true'
        run: |
          host=$([ "$BIND" = true ] && echo "$APP_DOMAIN" || terraform output -raw web_default_fqdn)
          for path in /api/healthz /v1/public/config; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /tmp/body -w '%{http_code}' "https://$host$path" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "https://$host$path -> $code: $(head -c 200 /tmp/body)"
            [ "$code" = 200 ]
          done
          echo "Deployed ${{ steps.mode.outputs.tag }} to https://$host" >>"$GITHUB_STEP_SUMMARY"
