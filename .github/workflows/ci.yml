name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  NODE_VERSION: "22"

jobs:
  python-checks:
    name: Python (lint, format, imports, types, generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Import contracts (no circular or cross-app imports)
        run: uv run lint-imports
      - name: mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - run: make typecheck-py
      - name: Generated files are up to date (court, plans, demo)
        run: |
          uv run python packages/court/scripts/generate.py --check
          uv run python packages/plans/generate.py --check
          uv run python apps/site/scripts/make_demo.py --check
      - name: OpenAPI client is up to date
        run: |
          uv run python -m handball_api.openapi /tmp/openapi.json
          diff -u packages/api-client/openapi.json /tmp/openapi.json

  python:
    name: Python tests (coverage gate 80 %)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handball
          POSTGRES_PASSWORD: handball
          POSTGRES_DB: handball
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handball" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: ffmpeg, tesseract and pdftotext (worker, overlay and report tests), cached
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3 (pinned by SHA)
        with:
          packages: ffmpeg tesseract-ocr poppler-utils
          version: "1"
      - run: uv sync --all-packages --frozen
      - name: Tests in parallel (pytest-xdist; coverage combined over the workers)
        run: uv run pytest apps packages -n auto --dist worksteal --cov --cov-report=term

  migrations:
    name: Migrations check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handball
          POSTGRES_PASSWORD: handball
          POSTGRES_DB: handball
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handball" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HB_MIGRATION_DATABASE_URL: postgresql+asyncpg://handball:handball@localhost:5432/handball
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run alembic upgrade head
      - name: App role is not a superuser
        run: psql postgresql://handball:handball@localhost:5432/handball -tAc "select rolsuper or rolbypassrls from pg_roles where rolname='handball_app'" | grep -qx f
      - name: Models and migrations are in sync
        run: uv run alembic check
      - name: Downgrade and upgrade again
        run: uv run alembic downgrade base && uv run alembic upgrade head

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm circular
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated TS client matches openapi.json
        run: |
          pnpm --filter @handball/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts
      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/site/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/site/src/**', 'apps/site/content/**', 'packages/*/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @handball/web build
      - name: Bundle budget (first-load JS per route)
        run: pnpm --filter @handball/web budget
      - name: Marketing site (static export)
        run: pnpm --filter @handball/site build

  images:
    name: Container build and scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, gpu-worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: handball-ai-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by SHA)
        with:
          image-ref: handball-ai-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml

  e2e:
    name: Stack (compose, integration, Playwright)
    runs-on: ubuntu-latest
    needs: [python-checks, python, web]
    env:
      # image names handball-ai-<service>, as built by infra/docker-bake.hcl
      COMPOSE_PROJECT_NAME: handball-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: ffmpeg (E2E test video), cached
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3 (pinned by SHA)
        with:
          packages: ffmpeg
          version: "1"
      - uses: docker/setup-buildx-action@v3
      - name: Build the app images with the layer cache of the images job
        uses: docker/bake-action@v6
        with:
          source: .
          files: infra/docker-bake.hcl
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            worker.cache-from=type=gha,scope=worker
            gpu-worker.cache-from=type=gha,scope=gpu-worker
            web.cache-from=type=gha,scope=web
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --no-build
      - name: Wait for API and web
        run: |
          for i in $(seq 1 90); do
            curl -fs localhost:8000/readyz && curl -fs localhost:3000/api/healthz && exit 0
            sleep 2
          done
          docker compose ps; docker compose logs --tail=100; exit 1
      - run: make test-integration
      - name: Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @handball/web exec playwright install --with-deps chromium
      - run: make test-e2e
      - if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    needs: [e2e, images]
    # Enabled once hosting is decided (docs/adr/002-hosting-region.md, OPEN_QUESTIONS Q-INFRA-1).
    if: github.event_name == 'pull_request' && vars.PREVIEW_DEPLOY_ENABLED == 'true'
    steps:
      - run: echo "Preview deploy target not configured yet" && exit 1
