<template id="t-z-upload">
<div class="halle app" data-bare="1">
  <div class="main" style="padding-top:18px">
    <div class="pagehead"><div><p class="date">Sonntag, 8. November</p><h1 class="h1">Gestern war Spiel.</h1></div></div>
    <section>
      <div class="head"><b>Letztes Spiel</b></div>
      <div class="drop">
        <div class="board s" style="width:100%"><div class="mid"><span class="led" aria-label="26 zu 18">26:18</span></div><div class="side"><b>gegen TSV Thalwil</b><small>Spielbericht ist da</small></div></div>
        <p><b>Lad das Video hoch.</b> Nach etwa 40 Minuten bekommst du die drei Dinge und alle Szenen.</p>
        <div class="actions"><span class="btn">Video wählen</span><span class="lnk">Link einfügen</span></div>
        <p class="tiny">Am besten im WLAN. Der Upload läuft weiter, wenn du die App schliesst.</p>
      </div>
    </section>
  </div>
</div>
</template>

<template id="t-z-laeuft">
<div class="halle app" data-bare="1">
  <div class="main" style="padding-top:18px">
    <div class="pagehead"><div><p class="date">Sonntag, 8. November</p><h1 class="h1">Die Analyse läuft.</h1></div></div>
    <section>
      <div class="head"><b>Letztes Spiel</b><span>noch etwa 25 Minuten</span></div>
      <ul class="steps">
        <li class="done"><span class="st">fertig</span>Video geladen, 58 Minuten</li>
        <li class="done"><span class="st">fertig</span>Spielfeld erkannt</li>
        <li class="now"><span class="st">läuft</span>Spielerinnen und Spieler verfolgen</li>
        <li class="soft"><span class="st">danach</span>Szenen schneiden</li>
        <li class="soft"><span class="st">danach</span>Drei Dinge schreiben</li>
      </ul>
      <div class="bar" style="max-width:none;margin-top:12px"><i style="width:48%"></i></div>
      <p class="small" style="margin-top:14px">Du bekommst eine Mitteilung. In der Zwischenzeit: <span class="lnk">Kader bestätigen</span>, das macht die Zahlen genauer.</p>
    </section>
  </div>
</div>
</template>
