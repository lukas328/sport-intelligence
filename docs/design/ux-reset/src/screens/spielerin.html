<template id="t-spielerin">
<div class="halle app" data-role="player" data-on="heute">
  <div class="main">
    <div class="pagehead"><div><p class="date">Dienstag, 10. November</p><h1 class="h1">Hoi Mia. Heute ist Training.</h1></div></div>

    <div class="cols">
      <div>
        <section>
          <div class="head"><b>Heute</b></div>
          <div class="led-row">
            <div class="mg"><span class="day" data-mark="circle">Di</span><span class="n">19:00</span></div>
            <div class="body">
              <h4>Training, Halle Seefeld</h4>
              <div class="seg" style="max-width:320px"><span class="on">Dabei</span><span>Abmelden</span></div>
              <p class="small">12 sind dabei. Du musst nichts tun, ausser du kannst nicht.</p>
            </div>
          </div>
        </section>

        <section>
          <div class="head"><b>Vom Samstag</b></div>
          <div class="board s" style="margin-bottom:14px">
            <div class="mid"><span class="led">26:18</span></div>
            <div class="side"><b>gegen TSV Thalwil</b><small>Du: 11 Paraden, 38 %. Deine Saison: 33 %.</small></div>
          </div>
          <div class="mine">
            <div class="mf-wrap"><svg class="mf" data-mf="p1"></svg><span class="len">0:14</span></div>
            <div class="mf-wrap"><svg class="mf" data-mf="p2"></svg><span class="len">0:12</span></div>
            <div class="mf-wrap"><svg class="mf" data-mf="p3"></svg><span class="len">0:16</span></div>
          </div>
          <p class="small" style="margin-top:10px">Deine drei besten Szenen. <span class="lnk">Alle 14 ansehen</span></p>
        </section>

        <section>
          <div class="head"><b>Kommt</b></div>
          <div class="led-row"><div class="mg">Do<span class="n">18:30</span></div><div class="body"><h4>Abschluss</h4><p class="okhand"><span data-mark="tick" class="tickbox" style="margin-right:8px"></span>dabei</p></div></div>
          <div class="led-row"><div class="mg">So<span class="n">17:30</span></div><div class="body"><h4>Spiel bei HSG Rheinau</h4><p class="small">Treff 16:15 vor der Halle</p><div class="seg" style="max-width:320px"><span>Dabei</span><span>Kann nicht</span></div></div></div>
        </section>
      </div>

      <aside>
        <section class="note" style="margin-top:14px">
          <span class="tape">Fürs Team</span>
          <p class="hand">Abwehr war <span data-mark="under">stark</span>. Heute üben wir den Rückzug. Wer kann, schaut vorher die 6 Szenen.</p>
          <p class="who">Demo Trainerin, Sonntag 21:14 · <span class="lnk">6 Szenen, 2 Minuten</span></p>
        </section>
        <section class="ask">
          <div class="crop">
            <svg viewBox="0 0 320 150" aria-hidden="true">
              <rect width="320" height="150" fill="var(--floor)"/>
              <path d="M-10 40 Q160 150 330 40" stroke="var(--line)" stroke-width="3" fill="var(--floor-area)"/>
              <rect x="120" y="-6" width="80" height="14" fill="var(--ink)"/>
              <circle cx="160" cy="42" r="10" fill="#f4f5f2" stroke="var(--ink)" stroke-width="1.5"/>
              <rect x="146" y="54" width="28" height="50" rx="9" fill="var(--club)" stroke="var(--ink)" stroke-width="1.5"/>
              <rect x="128" y="24" width="64" height="92" fill="none" stroke="var(--harz)" stroke-width="4"/>
            </svg>
            <span class="t">Samstag, 2. Halbzeit</span>
          </div>
          <div class="stack">
            <p><b>Bist du das?</b> Noch 2 Bilder, dann stimmen deine Zahlen.</p>
            <div class="two"><span class="btn">Ja, das bin ich</span><span class="btn line">Nein</span></div>
          </div>
        </section>
      </aside>
    </div>
  </div>
</div>
</template>
