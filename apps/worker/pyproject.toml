[project]
name = "handball-worker"
version = "0.1.0"
description = "Pipeline orchestration and CPU jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rq>=2.1",
  "redis>=5.2",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "boto3>=1.36",
  "httpx>=0.28",
  "numpy>=2.1",
  "pillow>=11",
  "handball-court",
  "handball-jobkit",
]

[project.scripts]
handball-worker = "handball_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handball_worker"]
