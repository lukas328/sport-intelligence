<!doctype html>
<!-- Hero (W3): the answer to the headline, large and readable. The first of the three things cut
     out of the phone, «9 von 18, Gegentore über aussen rechts», with «Alle 9» and the shots on the
     half court. Transparent around (the hero is club blue); no score, no headline of the match. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage">
  <div class="card screen" id="card" style="left: 18px; top: 14px; width: 444px"></div>
</div>
<script src="../stage.js"></script>
<script>
  S.stage(480, 480, { clear: true, budget2x: 110 * 1024 });
  const thing = S.rect("dinge-phone", "thing", [16, 290, 358, 110]);
  const dots = S.rect("dinge-phone", "dots", [325, 482, 42, 46]);
  // from just above «1 von 3» down to the 9 m line of the half court
  const from = thing[1] - 14;
  const s = S.screen(document.getElementById("card"), "dinge-phone", [6, from, 378, 350]);
  S.ring(s, dots, 9, true);
  // the label below and left of the shots, in the empty half court; a short arrow up to them
  const ring = S.at(s, dots, 0, 1);
  S.callout("dots", [ring[0] - 24, ring[1] + 86], [ring[0] - 2, ring[1] + 4], "l", 0.25, 60);
  S.done();
</script>
