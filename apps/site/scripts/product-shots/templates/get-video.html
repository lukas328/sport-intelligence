<!doctype html>
<!-- «Jedes Tor als Szene»: a match on the computer, the video (a real hall recording, blurred past
     recognition, L8), the scene that plays (yellow in the list) and all goals on the timeline; the
     tour pulls those two out as live components (U34). -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 70%; --to: 40%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(720, 520, { densities: [1, 2, 3] });
  const video = S.rect("video", "video", [32, 212, 844, 475]);
  const active = S.rect("video", "active", [908, 391, 340, 62]);
  const timeline = S.rect("video", "timeline", [32, 802, 844, 118]);
  const s = S.browser(
    "video",
    [16, video[1] - 24, 1248, timeline[1] + timeline[3] - video[1] + 40],
    {
      left: 28,
      top: 30,
      width: 664,
    },
  );
  // the video: the hall recording, blurred past recognition; the website writes «Dein Spiel» on it
  S.lettering(S.video(s, video, { cut: 78, bar: 63, at: 0.082 }));
  // the two places the tour pulls out (U34, tour-cuts.tsx): the scene that plays, the timeline
  S.mark("tap", s, active, 3);
  S.mark("timeline", s, timeline, 4);
  S.done();
</script>
