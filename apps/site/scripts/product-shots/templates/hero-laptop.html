<!doctype html>
<!-- Hero, computer: the team's start page after a match on a laptop, transparent around it (the
     hero is club blue). The website puts its phone (hero-phone) over the lower right corner and
     the callout over the shots of the first thing. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage">
  <div class="laptop" id="laptop" style="left: 36px; top: 8px; width: 688px">
    <div class="lid"><div class="screen" id="s"></div></div>
    <div class="base"></div>
  </div>
</div>
<script src="../stage.js"></script>
<script>
  S.stage(760, 500, { clear: true });
  const s = S.screen(document.getElementById("s"), "ergebnis-laptop");
  const dots = S.rect("ergebnis-laptop", "dots", [394, 860, 44, 51]);
  S.ring(s, dots, 7, true);
  // the label on the blue head of the page, under its title; the arrow down to the shots
  const head = S.onStage(s.el, [0, 0, 0, 0]);
  S.callout(
    "where",
    [head[0] + 30, head[1] + 0.42 * s.el.clientHeight],
    S.at(s, dots, 0.05, 0.1),
    "tl",
    0.28,
  );
  S.done();
</script>
