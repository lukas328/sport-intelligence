<!doctype html>
<!-- Hero, phone: the team's start page after a match, taller than the screen. The website shows it
     in its own phone frame (components/device.tsx) and lets it run slowly down and back. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="screen" id="s" style="width: 300px"></div></div>
<script src="../stage.js"></script>
<script>
  const c = S.cap("ergebnis-phone-tall");
  // loaded at once on the phone, next to the fonts of the title: kept light
  S.stage(300, Math.round((c.h * 300) / c.w), { budget2x: 110 * 1024 });
  S.screen(document.getElementById("s"), "ergebnis-phone-tall");
  S.done();
</script>
