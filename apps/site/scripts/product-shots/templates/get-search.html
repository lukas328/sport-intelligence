<!doctype html>
<!-- «Antworten statt Spulen»: «Szenen» with a search, its answer with the base (26 of 77) and the
     button that plays them all, zoomed onto the left column. No rings or callouts: the tour dims
     the picture and pulls the two marked places out as live components (U34, tour-cuts.tsx). -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 70%; --to: 40%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(720, 520, { densities: [1, 2, 3] });
  const search = S.rect("szenen", "search", [16, 257, 724, 64]);
  const answer = S.rect("szenen", "answer", [32, 466, 828, 107]);
  const play = S.rect("szenen", "play", [32, 584, 168, 48]);
  const s = S.browser("szenen", [16, search[1] - 26, 864, 560], { left: 28, top: 30, width: 760 });
  // the two places the tour pulls out (U34): the answer with its base, and «Alle 26 abspielen»
  S.mark("answer", s, [answer[0], answer[1], answer[2] * 0.62, answer[3]]);
  S.mark("play", s, play, 4);
  S.done();
</script>
