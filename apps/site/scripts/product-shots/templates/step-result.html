<!doctype html>
<!-- Step «Anschauen und teilen» (U33, after Lukas' design): the first of the three things of the
     website's match, large: a huge yellow «11», «von 29», «Gegentore über aussen rechts»; under
     it the half court with the goal at the top, the green goal area, and the 11 shot spots of the
     demo match (src/lib/story.ts, saturday(): all at the right wing) as yellow dots with their way
     into the goal, in a soft yellow light. Over it the collection the
     coach sends to the team chat, as the app shows it: «Aussen rechts zumachen» on the club's
     green, «4 Szenen», «HC Tannengrün Herren 1» and «Link teilen». In de, fr and en. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<style>
  .n {
    position: absolute;
    left: 30px;
    top: 26px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
  }
  .n .heavy {
    font-size: 250px;
    color: var(--attn);
    letter-spacing: -0.04em;
    text-shadow: 7px 7px 0 rgb(10 12 14 / 0.6);
  }
  .n .disp {
    margin-bottom: 8px;
    font-size: 60px;
    line-height: 1;
    color: #fff;
  }
  .what {
    position: absolute;
    left: 40px;
    right: 40px;
    top: 248px;
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
  }
  .set {
    left: 34px;
    top: 398px;
    width: 350px;
    padding: 0 0 16px;
  }
  .set h3 {
    margin: 0;
    padding: 14px 18px 16px;
    background: var(--club);
    color: #fff;
    font-size: 31px;
    line-height: 1.02;
    border-bottom: 3px solid var(--ink);
  }
  .set .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 0 18px;
  }
  .set .foot b {
    display: block;
    font-size: 21px;
  }
  .set .foot small {
    display: block;
    margin-top: 3px;
    font-size: 18px;
    font-weight: 500;
    color: #53565b;
    line-height: 1.25;
  }
  .set .foot span {
    flex: none;
    padding: 11px 14px;
    background: var(--ink);
    color: #fff;
    font-size: 19px;
    font-weight: 700;
  }
</style>
<div id="stage"></div>
<script src="../stage.js"></script>
<script src="../steps.js"></script>
<script>
  const W = 640;
  const H = 640;
  S.stage(W, H, { steps: true, langs: ["de", "fr", "en"], budget1x: 70 * 1024, budget2x: 120 * 1024 });
  const T = S.t({
    de: { of: "von 29", what: "Gegentore über aussen rechts", title: "Aussen rechts zumachen", scenes: "4 Szenen", team: "HC Tannengrün Herren 1", share: "Link teilen" },
    fr: { of: "sur 29", what: "buts encaissés par l’aile droite", title: "Fermer l’aile droite", scenes: "4 scènes", team: "HC Tannengrün Hommes 1", share: "Partager le lien" },
    en: { of: "of 29", what: "goals conceded on the right wing", title: "Close the right wing", scenes: "4 scenes", team: "HC Tannengrün Men 1", share: "Share link" },
  });
  const { K, ground, add, curve } = STEPS;

  // the 11 goals conceded over the right wing of the demo match, in half-court metres (u across,
  // v from the goal line; the spots of src/lib/story.ts saturday())
  const RA = [[17.9, 1], [18.2, 0.8], [17.7, 1.8], [19.2, 2.4], [17.7, 1.6], [17.5, 2.1], [19.5, 1.4], [19.2, 1.4], [17.8, 1.8], [19.3, 1.2], [19.5, 1.3]];

  // the half court from above, the goal at the top, a little turned; 27 px per metre
  const s = 27;
  const c = Math.cos((-5 * Math.PI) / 180);
  const d = Math.sin((-5 * Math.PI) / 180);
  const M = ([u, v]) => [72 + s * (u * c - v * d), 336 + s * (u * d + v * c)];
  const P = (list) => list.map((p) => M(p).map((n) => n.toFixed(1)).join(" ")).join("L");
  const L = `stroke="${K.chalk}" stroke-width="2.6" fill="none" stroke-linejoin="round"`;

  const g = [];
  g.push(`<rect width="${W}" height="${H}" fill="${K.night}"/>`);
  // the court, the goal area (6 m), the 9 m line, the 7 m mark, the goal
  g.push(`<path d="M${P([[0, 0], [20, 0], [20, 22], [0, 22]])}Z" fill="${K.night2}"/>`);
  const zone = [[2.5, 0], ...curve((t) => [8.5 - 6 * Math.sin(t), 6 * Math.cos(t)], Math.PI / 2, 0), ...curve((t) => [11.5 + 6 * Math.sin(t), 6 * Math.cos(t)], 0, Math.PI / 2), [17.5, 0]];
  g.push(`<path d="M${P(zone)}Z" fill="${K.pitch}" stroke="${K.chalk}" stroke-width="2.6"/>`);
  const a = Math.asin(8.5 / 9);
  const nine = [...curve((t) => [8.5 - 9 * Math.sin(t), 9 * Math.cos(t)], a, 0), ...curve((t) => [11.5 + 9 * Math.sin(t), 9 * Math.cos(t)], 0, a)];
  g.push(`<path d="M${P(nine)}" ${L} stroke-dasharray="8 7"/>`);
  g.push(`<path d="M${P([[9.5, 7], [10.5, 7]])}" ${L}/>`);
  g.push(`<path d="M${P([[0, 0], [20, 0], [20, 22], [0, 22]])}Z" ${L}/>`);
  g.push(`<path d="M${P([[8.5, 0], [8.5, -1], [11.5, -1], [11.5, 0]])}" fill="${K.night}" stroke="${K.attn}" stroke-width="4"/>`);
  // the 11 over the right wing: a light on the place, each shot's way into the goal, the spot
  const [hx, hy] = M([18.5, 1.6]);
  g.push(`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="54" fill="${K.attn}" fill-opacity=".16"/>`);
  RA.forEach((p, i) => {
    const aim = [8.8 + (2.4 * i) / (RA.length - 1), 0];
    g.push(`<path d="M${P([p, aim])}" stroke="${K.attn}" stroke-opacity=".55" stroke-width="2"/>`);
  });
  for (const p of RA) {
    const [x, y] = M(p);
    g.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${K.attn}" stroke="${K.ink}" stroke-width="2.6"/>`);
  }
  ground(g.join(""));

  const n = add(`<div class="n"><span class="heavy">11</span><span class="disp"></span></div>`);
  n.querySelector(".disp").textContent = T.of;
  const what = add(`<p class="what"></p>`);
  what.textContent = T.what;
  const set = add(`<div class="pc set" style="--tilt:-3deg"><h3 class="disp"></h3><div class="foot"><div><b></b><small></small></div><span></span></div></div>`);
  set.querySelector("h3").textContent = T.title;
  set.querySelector("b").textContent = T.scenes;
  set.querySelector("small").textContent = T.team;
  set.querySelector(".foot span").textContent = T.share;
  S.done();
</script>
