<!doctype html>
<!-- Step «Anschauen und teilen» (L9, L11): the phone in front of the hall with the first of the
     three things of the website's match, «11 von 29 Gegentore über aussen rechts», the runs on the
     half court and the shots ringed. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 88%; --to: 70%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(640, 760);
  document.getElementById("stage").classList.add("hall");
  const thing = S.rect("dinge-phone", "thing", [16, 290, 358, 110]);
  const dots = S.rect("dinge-phone", "dots", [325, 482, 42, 46]);
  // the screen from just above «1 von 3»
  const c = S.cap("dinge-phone");
  const s = S.phone("dinge-phone", { left: 117, width: 380, crop: [0, thing[1] - 22, c.w, c.h - thing[1] + 22], top: 40 });
  S.ring(s, dots, 8, true);
  S.done();
</script>
