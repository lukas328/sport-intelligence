<link rel="stylesheet" href="../stage.css" />
<div id="stage"></div>
<script src="../stage.js"></script>
<script>

  const dots = S.rect("dinge-phone", "dots", [325, 482, 42, 46]);
  // from just above «1 von 3» down through the half court
  const s = S.piece("dinge-phone", [6, thing[1] - 14, 378, 366], { left: 0, top: 0, width: 640 });
  S.ring(s, dots, 9, true);
  S.done();
</script>
