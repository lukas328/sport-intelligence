<!doctype html>
<!-- «Die Saison im Blick»: what repeats, one bar per match, and where on the court it happens.
     Cut below the page's title: the season's sentence belongs to the seeded club, not to the story
     on the website. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 72%; --to: 44%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(720, 430, { densities: [1, 2, 3] });
  const bars = S.rect("saison", "bars", [728, 445, 132, 85]);
  const court = S.rect("saison", "court", [908, 399, 340, 276]);
  // from «Was sich wiederholt» (just above the rows with the bars) to the bottom of the capture
  const c = S.cap("saison");
  const from = court[1] - 120;
  const s = S.browser("saison", [16, from, 1248, c.h - from], { left: 28, top: 30, width: 664 });
  // the place the tour pulls out (U34, tour-cuts.tsx): the first theme that repeats, from its
  // title (left, at the content's edge) to its bars, one per match
  S.mark("bars", s, [32, bars[1] - 14, bars[0] + bars[2] - 32, bars[3] + 22]);
  S.done();
</script>
