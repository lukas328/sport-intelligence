<!doctype html>
<!-- Step «Prüfen» (U1, U3): the app's question large. Two cut-outs of the same screen of the real
     app (capture step-pruefen), flat on the app's cloth with its ink edge: above, the picture the
     question is about, with the field the analysis proposes in the app's yellow (four corner
     points, the near ones at the picture's edge, as the app sets them); below, «Frage 1 von 1»,
     «Passt das Spielfeld?» and «Passt» ringed. The picture shows the hall of step 1 as the phone on
     its tripod sees it (hall.js, sharp, no people) instead of the synthetic demo clip. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"></div>
<script src="../stage.js"></script>
<script src="../hall.js"></script>
<script>
  S.stage(640, 640, { cloth: true });
  const NAME = "step-pruefen";
  const frame = S.rect(NAME, "picture", [16, 190.7, 328, 200]);
  const count = S.rect(NAME, "count", [16, 578, 91, 21.7]);
  const yes = S.rect(NAME, "yes", [16, 765, 328, 56]);
  // the picture inside the player's dark frame (measured on the capture: 16:9, 8 px in from the
  // frame's sides, 17 px from its top)
  const pic = [frame[0] + 17.7, frame[1] + 17.3, frame[2] - 35.4, (frame[2] - 35.4) * (9 / 16)];

  // above right: the picture in its frame
  const a = S.cut(NAME, frame, { left: 236, top: 28, width: 376 });
  // below left: the question with its answers, from «Frage 1 von 1» to under «Passt»
  const y0 = count[1] - 10;
  const b = S.cut(NAME, [8, y0, 344, yes[1] + yes[3] + 8 - y0], { left: 28, top: 0, width: 492 });
  const bEl = b.el.parentElement;
  bEl.style.top = `${640 - 28 - bEl.offsetHeight}px`;

  // the camera's view of the hall over the app's picture, with the proposed field
  const [x, y, w, h] = a([pic[0] - 1, pic[1] - 1, pic[2] + 2, pic[3] + 2]);
  const v = HALL.view({ eye: [20, 24.2, 3.1], look: [20, 8.5, 0], focal: w * 0.269, cx: w / 2, cy: h * 0.4273, line: 0.55 });
  const { C, P } = v;
  const inset = 4;
  // where the near sideline (y = 20) meets the picture's left or right edge (the view looks
  // across the court from its near side, so x runs from right to left in the picture)
  function edge(want) {
    let lo = 0;
    let hi = 40;
    for (let i = 0; i < 50; i++) {
      const mid = (lo + hi) / 2;
      if (P([mid, 20, 0])[0] > want) lo = mid;
      else hi = mid;
    }
    return P([(lo + hi) / 2, 20, 0]);
  }
  const corners = [P([0, 0, 0]), P([40, 0, 0]), edge(inset), edge(w - inset)];
  const mid = [P([20, 0, 0]), P([20, 20, 0])];
  const pts = (list) => list.map((p) => p.map((n) => n.toFixed(1)).join(" ")).join(" L");
  const box = document.createElement("div");
  Object.assign(box.style, { position: "absolute", left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;overflow:visible">
    <clipPath id="pic"><rect width="${w}" height="${h}"/></clipPath>
    <g clip-path="url(#pic)"><rect width="${w}" height="${h}" fill="${C.wall}"/>${v.hall({ wallTop: 12 })}${v.goal(-1)}${v.goal(1)}</g>
    <path d="M${pts(corners)} Z M${pts(mid)}" fill="rgb(255 210 60 / .12)" stroke="${C.attn}" stroke-width="2.4" stroke-linejoin="round"/>
    ${corners.map(([cx, cy]) => `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7.5" fill="${C.attn}" stroke="${C.ink}" stroke-width="2.6"/>`).join("")}
  </svg>`;
  a.el.append(box);
  S.ring(b, yes, 4);
  S.done();
</script>
