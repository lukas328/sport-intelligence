<!doctype html>
<!-- Step «Prüfen» (L9, L11): the phone in front of the hall, the app's question «Passt das
     Spielfeld?» with «Passt» ringed. The picture the question is about shows the hall recording
     (blurred past recognition, like step 1) instead of the synthetic demo clip, with the field the
     analysis proposes drawn over it in the app's yellow: four corner points and the lines between. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 88%; --to: 70%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(640, 760);
  document.getElementById("stage").classList.add("hall");
  const yes = S.rect("pruefen-phone", "yes", [16, 614, 358, 56]);
  // the app's video picture inside its dark frame (measured on the capture)
  const pic = [35, 41, 320, 179];
  const c = S.cap("pruefen-phone");
  const s = S.phone("pruefen-phone", { left: 117, width: 380, crop: [0, 10, c.w, c.h - 10], top: 40 });
  const [x, y, w, h] = s(pic);
  const box = document.createElement("div");
  box.className = "hall-video";
  Object.assign(box.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, backgroundPosition: "40% 45%" });
  // the proposed field: corners as the app places them, the lines between, the middle line
  const P = [
    [0.27, 0.36],
    [0.74, 0.36],
    [0.985, 0.7],
    [0.015, 0.7],
  ].map(([fx, fy]) => [fx * w, fy * h]);
  const mid = [(P[0][0] + P[1][0]) / 2, P[0][1], (P[2][0] + P[3][0]) / 2, P[2][1]];
  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;inset:0">
    <path d="M${P.map((p) => p.join(" ")).join("L")}Z M${mid[0]} ${mid[1]}L${mid[2]} ${mid[3]}" fill="rgb(255 210 60 / .12)" stroke="#ffd23c" stroke-width="2.5" stroke-linejoin="round"/>
    ${P.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#ffd23c" stroke="#16171a" stroke-width="3"/>`).join("")}
  </svg>`;
  s.el.append(box);
  S.ring(s, yes, 4);
  S.done();
</script>
