<!doctype html>
<!-- Step «Hochladen» (L9, L11): the phone in front of the hall (the same blurred recording as
     step 1, so the three steps are one picture story), «Video hochladen», which match is the
     video from, the first match ringed. The phone comes in from the top edge and leaves at the
     bottom: the screen is what matters. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><div class="keil" style="--from: 88%; --to: 70%"></div></div>
<script src="../stage.js"></script>
<script>
  S.stage(640, 760);
  document.getElementById("stage").classList.add("hall");
  const dialog = S.rect("hochladen-phone", "dialog", [0, 74, 390, 776]);
  const first = S.rect("hochladen-phone", "first", [24, 176, 342, 56]);
  // the screen from the sheet's top: the phone's upper edge in the picture, the rest runs out below
  const c = S.cap("hochladen-phone");
  const s = S.phone("hochladen-phone", { left: 117, width: 380, crop: [0, dialog[1], c.w, c.h - dialog[1]], top: 40 });
  S.ring(s, first, 5);
  S.done();
</script>
