<!doctype html>
<!-- Step «Filmen» (U1, U3): where the camera goes, as a calm drawing in the site's colours. The
     hall seen from behind and above the camera: the whole court with both goals, the camera on a
     tall tripod at the centre line (about 3 m high, just off the court), its place ringed in
     yellow, and what it sees, from goal to goal. True perspective (hall.js); only the tripod is
     drawn larger than life, so it can be seen. No words, so it works in every language («3 m»
     reads in all three); the text beside it says the rest. The same square frame as the other
     steps. -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="../stage.js"></script>
<script src="../hall.js"></script>
<script>
  const W = 640;
  const H = 640;
  S.stage(W, H, { budget1x: 60 * 1024, budget2x: 110 * 1024 });
  const v = HALL.view({ eye: [20, 31, 46], look: [20, 12.5, 0], focal: 660, cx: W / 2, cy: 344, line: 1.2 });
  const { C, P, poly, path, curve } = v;
  const art = [v.hall({ wallTop: 22, near: 70 })];

  // the camera's place: just off the court at the centre line. The tripod and the phone are drawn
  // as a sign at a fixed size (true to scale, a 3 m tripod against a 40 m court would be a stroke)
  const [fx, fy] = P([20, 24.2, 0]);
  const TH = 178; // the tripod's height in px, foot to phone
  const lens = [fx, fy - TH - 18];
  // what the camera sees: from its lens to the far corners, the court in its light
  art.push(poly([lens, [-1.5, -0.8, 0], [41.5, -0.8, 0]], `fill="${C.attn}" fill-opacity=".26"`));
  for (const corner of [[0, 0, 0], [40, 0, 0]])
    art.push(path([lens, corner], `stroke="${C.ink}" stroke-width="1.8" stroke-dasharray="2 6" stroke-linecap="round"`));
  art.push(v.goal(-1), v.goal(1));
  // a yellow ring on the floor, in the floor's perspective
  const ring = curve((t) => [20 + 2.1 * Math.cos(t), 24.2 + 2.1 * Math.sin(t), 0], 0, 2 * Math.PI, 72);
  const ringD = `M${ring.map((p) => P(p).map((n) => n.toFixed(1)).join(" ")).join(" L")}Z`;
  art.push(`<path d="${ringD}" fill="${C.attn}" fill-opacity=".45" stroke="${C.ink}" stroke-width="9"/>`);
  art.push(`<path d="${ringD}" fill="none" stroke="${C.attn}" stroke-width="5"/>`);
  // the tripod: three legs to the head, the column up to the phone
  const head = [fx, fy - TH + 34];
  const crown = [fx, fy - TH];
  const leg = `stroke="${C.ink}" stroke-width="5" stroke-linecap="round" fill="none"`;
  const feet = [[fx - 34, fy + 9], [fx + 34, fy + 9], [fx + 4, fy - 12]];
  art.push(`<path d="M${feet[2].join(" ")}L${head.join(" ")}" ${leg} stroke-width="4"/>`);
  art.push(`<path d="M${head.join(" ")}L${crown.join(" ")}" ${leg} stroke-width="7"/>`);
  art.push(`<path d="M${feet[0].join(" ")}L${head.join(" ")}L${feet[1].join(" ")}" ${leg} stroke-linejoin="round"/>`);
  // the phone across, filming the court: its back to us, the lenses top left
  const pw = 88;
  const ph = 44;
  const r = { x: fx - pw / 2, y: crown[1] - ph + 6 };
  art.push(`<rect x="${fx - 12}" y="${crown[1] - 4}" width="24" height="12" fill="${C.ink}"/>`);
  art.push(`<rect x="${r.x}" y="${r.y}" width="${pw}" height="${ph}" rx="9" fill="${C.ink}"/>`);
  art.push(`<rect x="${r.x + 9}" y="${r.y + 8}" width="34" height="27" rx="8" fill="#33363b"/>`);
  art.push(`<circle cx="${r.x + 21}" cy="${r.y + 18}" r="6" fill="#0b0c0d" stroke="#7a8089" stroke-width="1.5"/>`);
  art.push(`<circle cx="${r.x + 34}" cy="${r.y + 26}" r="4" fill="#0b0c0d" stroke="#7a8089" stroke-width="1.5"/>`);
  // the height: «3 m» beside the tripod
  const mx = fx + 78;
  art.push(`<path d="M${mx} ${fy}V${crown[1] - ph / 2}M${mx - 9} ${fy}h18M${mx - 9} ${crown[1] - ph / 2}h18" stroke="${C.ink}" stroke-width="2.4" fill="none"/>`);
  art.push(`<text x="${mx + 16}" y="${(fy + crown[1] - ph / 2) / 2 + 9}" font-family="Plex Mono, ui-monospace, monospace" font-weight="500" font-size="26" fill="${C.ink}">3 m</text>`);

  const svg = document.getElementById("art");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.style.display = "block";
  svg.innerHTML = `<rect width="${W}" height="${H}" fill="${C.ground}"/>` + art.join("");
  S.done();
</script>
