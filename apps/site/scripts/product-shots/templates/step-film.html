<!doctype html>
<!-- Step «Filmen» (U33, after Lukas' design): where the camera goes. The whole court from above,
     a little turned, on the dark court ground with the club's green around it: a defence 6-0 in
     green against the attack in white, the ball in yellow. The camera (the yellow disc) stands at
     the middle of the near sideline, and its light covers the whole court: the dotted yellow line
     runs from the camera round both goals, so both are in the picture. «3m» on the big yellow
     card beside it, the step's word in the back, one white line at the foot, in de, fr and en.
     Tried and set aside (18.11.): the court in perspective from behind the camera, flat or high
     (the near corners run out of the picture or the court gets small), and only one half large
     (then the second goal is not in the picture, which is the point of the step). -->
<meta charset="utf-8" />
<link rel="stylesheet" href="../stage.css" />
<div id="stage"></div>
<script src="../stage.js"></script>
<script src="../steps.js"></script>
<script>
  const W = 640;
  const H = 640;
  S.stage(W, H, { steps: true, langs: ["de", "fr", "en"], budget1x: 70 * 1024, budget2x: 120 * 1024 });
  const T = S.t({
    de: { word: "Filmen", say: "Hoch an die Mittellinie. Beide Tore im Bild." },
    fr: { word: "Filmer", say: "En hauteur, à la ligne médiane. Les deux buts dans l’image." },
    en: { word: "Film", say: "High up at the halfway line. Both goals in view." },
  });
  const { K, court, dots, ground, ghost, say, camera, add, path } = STEPS;

  // a defence 6-0 at the left goal (ours, green) against the attack (theirs, white), the ball
  const OURS = [[0.9, 10], [6.6, 3.6], [7.4, 7.2], [7.7, 10.1], [7.4, 12.9], [6.6, 16.4], [4.2, 19]];
  const THEIRS = [[10.6, 2.6], [11.4, 7.1], [7.9, 8.8], [10.4, 11.8], [11.2, 15.6], [9.6, 18.3], [39.1, 10]];
  const BALL = [12.2, 7.6];

  // the court from above, turned by 5 degrees, 13.4 px per metre, its middle at [322, 238]
  const s = 13.4;
  const c = Math.cos((-5 * Math.PI) / 180);
  const d = Math.sin((-5 * Math.PI) / 180);
  const M = ([x, y]) => [322 + s * ((x - 20) * c - (y - 10) * d), 238 + s * ((x - 20) * d + (y - 10) * c)];
  // the camera: at the centre line, a few metres behind the near sideline
  const cam = M([20, 23.2]);

  const g = [];
  g.push(`<rect width="${W}" height="${H}" fill="${K.night}"/>`);
  // the hall's floor around the court in the club's green
  g.push(`<path d="${path(M, [[-6, -4], [46, -4], [46, 24], [-6, 24]], true)}" fill="${K.pitch2}"/>`);
  g.push(court(M, { floor: K.night2, zone: K.pitch, w: 2.6 }));
  // what the camera sees: from the lens over the whole court, both goals included
  const fan = [cam, M([-1.3, 20.5]), M([-1.3, -0.5]), M([41.3, -0.5]), M([41.3, 20.5])];
  g.push(`<defs><radialGradient id="light" cx="${cam[0]}" cy="${cam[1]}" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${K.attn}" stop-opacity=".38"/><stop offset="1" stop-color="${K.attn}" stop-opacity=".07"/></radialGradient></defs>`);
  g.push(`<path d="M${fan.map((p) => p.map((n) => n.toFixed(1)).join(" ")).join("L")}Z" fill="url(#light)"/>`);
  const dash = `stroke="${K.attn}" stroke-width="3.4" stroke-dasharray="1 8" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  g.push(`<path d="M${[fan[4], cam, fan[1], fan[2], fan[3], fan[4]].map((p) => p.map((n) => n.toFixed(1)).join(" ")).join("L")}" ${dash}/>`);
  g.push(dots(M, OURS, { fill: K.pitch3, r: 10 }));
  g.push(dots(M, THEIRS, { fill: "#fff", r: 10 }));
  g.push(dots(M, [BALL], { fill: K.attn, r: 5.5, ew: 2 }));
  ground(g.join(""));

  ghost(T.word, { left: "-12px", top: "-8px" });
  camera(cam, 34);
  // how high: on the big card beside the camera
  add(`<div class="yc heavy" style="--tilt:-5deg;left:388px;top:388px;font-size:92px;padding:8px 20px 14px">3<span style="margin-left:.06em">m</span></div>`);
  say(T.say);
  S.done();
</script>
