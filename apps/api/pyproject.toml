[project]
name = "handball-api"
version = "0.1.0"
description = "Handball AI platform REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "rq>=2.1",
  "boto3>=1.36",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.20",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=44.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "aiosmtplib>=3.0",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "handball-court",
]

[project.scripts]
handball-api = "handball_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handball_api"]
