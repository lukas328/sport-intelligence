[project]
name = "handball-gpu-worker"
version = "0.1.0"
description = "CV/ML inference worker behind the GpuBackend abstraction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rq>=2.1",
  "redis>=5.2",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "handball-court",
  "handball-jobkit",
  "handball-vision",
]

[project.optional-dependencies]
# Installed in the CUDA image only (Dockerfile.cuda), from M3 on.
inference = ["onnxruntime>=1.20", "numpy>=2.1", "av>=14.0"]

[project.scripts]
handball-gpu-worker = "handball_gpu_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handball_gpu_worker"]
