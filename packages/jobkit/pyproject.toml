[project]
name = "handball-jobkit"
version = "0.1.0"
description = "Shared helpers for pipeline workers: progress reporting to the API, object storage"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "boto3>=1.36", "structlog>=24.4", "pydantic-settings>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handball_jobkit"]
