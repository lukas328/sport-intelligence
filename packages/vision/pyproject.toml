[project]
name = "handball-vision"
version = "0.1.0"
description = "Computer vision for handball: calibration, detection, tracking, team assignment, synthetic data, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "opencv-python-headless>=4.10,<5",
  "scipy>=1.14",
  "pyarrow>=18",
  "av>=14",
  "onnxruntime>=1.20",
  "handball-court",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handball_vision"]
