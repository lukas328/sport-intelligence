[project]
name = "handball-metrics"
version = "0.1.0"
description = "Handball metric definitions and computation from events (BRIEF 4.8)"
requires-python = ">=3.12,<3.13"
dependencies = ["handball-court"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handball_metrics"]
